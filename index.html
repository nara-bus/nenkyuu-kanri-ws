<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .tab-bar {

  /* ダイヤ変更テンキー */
  .dia-numpad-box {

    border-bottom: 2px solid rgba(80,150,110,0.28);

  .shift-icon { font-size: 18px; min-width: 26px; text-align: center; }
  .shift-label { flex: 1; font-size: 13px; color: #5a8a72; font-weight: 500; letter-spacing: 0.02em; }
  .shift-time { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; padding: 4px 10px; }
  /* 出勤時間・ダイヤ番号のタップボタン */
  .shukkin-btn {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 18px; font-weight: 700; letter-spacing: 0.05em;
    background: linear-gradient(170deg, #fefae8 0%, #faf2cc 100%);
    border: 1px solid rgba(180,160,80,0.38);
    border-bottom: 3px solid rgba(160,140,60,0.38);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(160,140,60,0.16), 0 3px 6px rgba(160,140,60,0.08), inset 0 1px 0 rgba(255,255,255,0.80);

  }

    background: linear-gradient(170deg, #fff4f7 0%, #fce4ec 100%);

    box-shadow: inset 0 2px 4px rgba(0,0,0,0.12), 0 1px 0 rgba(160,40,70,0.18);

  }
  .rosen-row {
    display: flex;

    gap: 8px;
    padding-top: 6px;
  }

  .rosen-label { font-size: 12px; color: rgba(60,120,90,0.55); }
  .rosen-val { font-size: 13px; color: #2d8a5e; font-weight: 600; }
  .kyukyu-card {
    background: rgba(255,252,240,0.95);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(100,180,140,0.2);

    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 70px;
  }
  .kyukyu-icon { font-size: 22px; }
  .kyukyu-text { font-size: 18px; font-weight: 700; color: #e03050; }
  .yobi-text { font-size: 18px; font-weight: 700; color: #6a9e85; }

    padding: 0 20px 30px;
    color: #90c0a8;

    align-items: center;
    gap: 6px;
    letter-spacing: 0.04em;

    text-shadow: 0 1px 2px rgba(0,0,0,0.18);

  .settings-row-sub { font-size: 11px; color: #80aa92; margin-top: 2px; }
  .settings-input {
    background: linear-gradient(170deg, #e8f5ee 0%, #d4ede0 100%);
    border: 1px solid rgba(80,160,120,0.45);
    border-bottom: 2px solid rgba(60,130,95,0.5);

  .settings-input-hm { width: 54px; font-size: 15px; }

    background: linear-gradient(170deg, #e8f5ee 0%, #d4ede0 100%);
    border: 1px solid rgba(80,160,120,0.45);
    border-bottom: 2px solid rgba(60,130,95,0.5);
    border-radius: 8px;
    color: #2d5a47;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 10px;
    font-family: inherit;
    width: 160px;

    color-scheme: light;
    box-shadow: inset 0 2px 5px rgba(40,100,70,0.13), 0 1px 0 rgba(255,255,255,0.8);
  }
  .settings-input-date:focus { outline: none; border-color: #3d9e6e; box-shadow: 0 0 0 2px rgba(61,158,110,0.25); }
  .hm-wrap { display: flex; align-items: center; gap: 4px; }
  .hm-input {
    background: linear-gradient(170deg, #e8f5ee 0%, #d4ede0 100%);
    border: 1px solid rgba(80,160,120,0.45);
    border-bottom: 2px solid rgba(60,130,95,0.5);
    border-radius: 8px;
    color: #2d5a47;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 0;
    text-align: center;

  }

  .hm-unit { font-size: 12px; color: #80aa92; white-space: nowrap; }
  .unit-label { font-size: 12px; color: #80aa92; margin-left: 4px; white-space: nowrap; }
  .input-unit-wrap { display: flex; align-items: center; }
  .toggle-wrap { position: relative; display: inline-block; width: 50px; height: 28px; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(130,185,155,0.35); border-radius: 28px; transition: 0.3s;
    border: 1px solid rgba(100,180,140,0.3);
  }
  .toggle-slider:before {
    position: absolute; content: "";
    height: 22px; width: 22px; left: 2px; bottom: 2px;
    background: linear-gradient(170deg, #ffffff 0%, #f0f0f0 100%);
    border-radius: 50%; transition: 0.3s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.15);
  }
  .toggle-wrap input:checked + .toggle-slider { background: #3d9e6e; border-color: #3d9e6e; }
  .toggle-wrap input:checked + .toggle-slider:before { transform: translateX(22px); }
  .save-btn {

    padding: 14px;
    background: linear-gradient(170deg, #4db880 0%, #3d9e6e 60%, #2f8a5c 100%);
    color: #fff;

function isDefaultSettings(s) {
  // すべての値がデフォルト値と一致する場合のみ true → 警告
  // （一部だけ一致しても設定済みとみなす）
  return (
    s.baseDate        === DEFAULT_SETTINGS.baseDate        &&
    (s.wakeBeforeLeave   ?? DEFAULT_SETTINGS.wakeBeforeLeave)   === DEFAULT_SETTINGS.wakeBeforeLeave   &&
    (s.leaveBeforeWork   ?? DEFAULT_SETTINGS.leaveBeforeWork)   === DEFAULT_SETTINGS.leaveBeforeWork   &&
    (s.arriveBeforeStart ?? DEFAULT_SETTINGS.arriveBeforeStart) === DEFAULT_SETTINGS.arriveBeforeStart &&
    (s.returnAfterEnd    ?? DEFAULT_SETTINGS.returnAfterEnd)    === DEFAULT_SETTINGS.returnAfterEnd
  );
}

function loadSettings() {
  try {
    const s = localStorage.getItem('shiftSettings');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return Object.assign({}, DEFAULT_SETTINGS);
}
function saveSettings(s) {
  try { localStorage.setItem('shiftSettings', JSON.stringify(s)); } catch(e) {}
}

let SETTINGS = loadSettings();

function getBaseDate() {
  const parts = (SETTINGS.baseDate || '2026-04-01').split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
}
function getBaseDia() { return parseInt(SETTINGS.baseDia) || 1; }
function getCycle()   { return parseInt(SETTINGS.cycle) || 57; }

function getDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDiaForDate(date) {
  const start = getBaseDate(); start.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const diff = Math.round((d - start) / 86400000);
  const cycle = getCycle();
  return ((diff + getBaseDia() - 1) % cycle + cycle) % cycle + 1;
}

function getDayType(date) {
  const dow = date.getDay();
  const key = getDateKey(date);
  if (HOLIDAYS.has(key) || dow === 0) return '日祝';
  if (dow === 6) return '土曜';
  return '平日';
}

// DIADATAの時刻文字列（24:xx / 25:xx）をSCHEDULES形式（+00:xx）に変換
function _convTime(t) {
  if (!t) return null;
  const parts = t.split(':');
  const h = parseInt(parts[0]), m = parseInt(parts[1]);
  if (h >= 24) return '+' + String(h - 24).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// DIADATAの1曜日分データをSCHEDULES互換のshiftオブジェクトに変換
function _diaRowToShifts(row, dateKey) {
  if (!row || row.type === '公休') return null;
  if (row.yobi) return 'yobi';
  // 中間（前半＋後半）
  if (row.okibo2 !== undefined) {
    return [
      { shukkinTime: _convTime(row.start),  taikinTime: _convTime(row.taikin), rosen: row.rosen  || '', kikaku: _convTime(row.kitan),  _dateKey: dateKey },
      { shukkinTime: _convTime(row.start2), taikinTime: _convTime(row.taikin2),rosen: row.rosen2 || '', kikaku: _convTime(row.kitan2), _dateKey: dateKey },
    ];
  }
  return [{ shukkinTime: _convTime(row.start), taikinTime: _convTime(row.taikin), rosen: row.rosen || '', kikaku: _convTime(row.kitan), _dateKey: dateKey }];
}

function getSchedule(date) {
  const key = getDateKey(date);
  const dayType = getDayType(date);
  const dia = DIA_OVERRIDES[key] !== undefined ? DIA_OVERRIDES[key] : getDiaForDate(date);

  // renderIchiran内のICHIRANと同じデータをここでも参照できるよう
  // ICHIRAN_DATA としてグローバルに持つ（後述）
  const entry = ICHIRAN_DATA.find(r => r.dia === dia);
  if (!entry) return { dia, dayType, kyukyu: true };
  if (entry.type === '公休') return { dia, dayType, kyukyu: true };
  if (entry.type === '予備') return { dia, dayType, yobi: true };

  // 曜日に対応する行を選択
  const rowKey = dayType === '平日' ? 'hei' : dayType === '土曜' ? 'doy' : 'nch';
  const row = entry[rowKey];

  if (!row) return { dia, dayType, kyukyu: true };
  if (row.type === '公休') return { dia, dayType, kyukyu: true };
  if (row.yobi) return { dia, dayType, yobi: true };

  const shifts = _diaRowToShifts(row, key);
  if (!shifts) return { dia, dayType, kyukyu: true };
  if (shifts === 'yobi') return { dia, dayType, yobi: true };
  return { dia, dayType, shifts };
}

function fmtTime(t) {
  if (!t) return '—';
  if (t.startsWith('+')) return '翌' + t.slice(1);
  return t;
}

// "HH:MM" or "+HH:MM" → 総分数
function timeToMin(t) {
  if (!t) return null;
  const nextDay = t.startsWith('+');
  const s = nextDay ? t.slice(1) : t;
  const [h, m] = s.split(':').map(Number);
  return (nextDay ? 1440 : 0) + h * 60 + m;
}

// 総分数 → "HH:MM" (翌日なら "翌HH:MM")
function minToTime(min) {
  if (min === null) return '—';
  const nextDay = min >= 1440;
  const m = ((min % 1440) + 1440) % 1440;
  const hh = String(Math.floor(m / 60)).padStart(2, '0');
  const mm = String(m % 60).padStart(2, '0');
  return (nextDay ? '翌' : '') + hh + ':' + mm;
}

// オフセットを適用した時刻を返す（分を加減算）
function calcTime(baseTime, offsetMin) {
  const base = timeToMin(baseTime);
  if (base === null) return null;
  return base + offsetMin;
}

function buildShiftCard(shifts, isKyukyu, isYobi) {
  if (isYobi) return `<div class="kyukyu-card"><span class="yobi-text">予　備</span></div>`;
  if (isKyukyu) {
    return `<div class="kyukyu-card"><span class="kyukyu-icon">🏖️</span><span class="kyukyu-text">公　休</span></div>`;
  }
  const s = SETTINGS;
  // すべて勤務開始時刻（shukkinTime）を基準にオフセット計算
  const wake   = s.wakeBeforeLeave   ?? 90;  // 勤務開始の何分前に起床
  const leave  = s.leaveBeforeWork   ?? 60;  // 勤務開始の何分前に出社
  const arrive = s.arriveBeforeStart ?? 30;  // 勤務開始の何分前に到着
  const retMin = s.returnAfterEnd    ?? 10;  // 退勤後何分で帰宅

  return `<div class="shift-cards">${shifts.map((sh, i) => {
    const dateKey = sh._dateKey || '';
    const shiftIdx = i;
    const overrideKey = dateKey + '_' + i;
    const overrideMin = SHUKKIN_OVERRIDES[overrideKey];
    const isOverride = overrideMin !== undefined;
    const workStartMin  = isOverride ? overrideMin : timeToMin(sh.shukkinTime);
    const workStartColor = isOverride ? '#b8355a' : '#ff5cb8';
    const shukkinOverrideFlag = isOverride ? ' ✎' : '';
    const okiboMin      = workStartMin !== null ? workStartMin - wake   : null;
    const shusshaMin    = workStartMin !== null ? workStartMin - leave  : null;
    const tochakuMin    = workStartMin !== null ? workStartMin - arrive : null;
    const taikinTimeMin = timeToMin(sh.taikinTime);
    const kikakuMin     = taikinTimeMin !== null ? taikinTimeMin + retMin : null;

    return `
    <div class="shift-card">
      ${shifts.length > 1 ? `<div class="shift-sublabel">${i === 0 ? '中間前半' : '中間後半'}</div>` : ''}
      ${s.showOkibo ? `<div class="shift-row">
        <span class="shift-icon">⏰</span>
        <span class="shift-label">① 起床</span>
        <span class="shift-time" style="color:#1a1a1a">${minToTime(okiboMin)}</span>
      </div>` : ''}
      ${s.showShukkin ? `<div class="shift-row">
        <span class="shift-icon">🚙</span>
        <span class="shift-label">② 出社（家を出る）</span>
        <span class="shift-time" style="color:#1a1a1a">${minToTime(shusshaMin)}</span>
      </div>` : ''}
      ${s.showTochaku ? `<div class="shift-row">
        <span class="shift-icon">🏢</span>
        <span class="shift-label">③ 到着（会社）</span>
        <span class="shift-time" style="color:#1a1a1a">${minToTime(tochakuMin)}</span>
      </div>` : ''}
      ${s.showShukkinTime ? `<div class="shift-row">
        <span class="shift-icon">▶️</span>
        <span class="shift-label">④ 出勤時間（勤務開始）</span>
        <button class="shukkin-btn${isOverride ? ' override' : ''}" style="color:${workStartColor}" onclick="openShukkinNumpad('${dateKey}',${shiftIdx},'${sh.shukkinTime}')">${minToTime(workStartMin)}${shukkinOverrideFlag}</button>
      </div>` : ''}
      ${s.showTaikinTime ? `<div class="shift-row">
        <span class="shift-icon">⏹️</span>
        <span class="shift-label">⑤ 退勤時間（勤務終了）</span>
        <span class="shift-time" style="color:#2979ff">${minToTime(taikinTimeMin)}</span>
      </div>` : ''}
      ${s.showKikaku ? `<div class="shift-row">
        <span class="shift-icon">🏠</span>
        <span class="shift-label">⑥ 帰宅（家に到着）</span>
        <span class="shift-time" style="color:#1a1a1a">${minToTime(kikakuMin)}</span>
      </div>` : ''}
      ${sh.rosen !== undefined ? `<div class="rosen-row"><span class="rosen-icon">🚌</span><span class="rosen-label">路線:</span><span class="rosen-val">${sh.rosen || '—'}</span></div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function renderIchiran() {
  const ICHIRAN = ICHIRAN_DATA;

  const today = new Date(); today.setHours(0,0,0,0);
  const todayDia = getDiaForDate(today);
  const todayDayType = getDayType(today);

  function typeBadgeHtml(type) {
    if (!type) return '';
    if (type === '公休' || type === '予備') return '';
    const map = { '中間': ['#d4f0e3','#2d7a50'], '手入': ['#ffe8c0','#8a5500'] };
    const [bg, col] = map[type] || ['#eee','#555'];
    return `<span class="ich-card-type-badge" style="background:${bg};color:${col}">${type}</span>`;
  }

  // ダイヤ番号から「次に回ってくる日付」を求めてDayTypeを返す
  function getDayTypeForDia(dia) {
    const start = getBaseDate(); start.setHours(0,0,0,0);
    const baseDia = getBaseDia();
    const cycle = getCycle();
    const todayDiff = Math.round((today - start) / 86400000);
    const todayDiaIdx = ((todayDiff + baseDia - 1) % cycle + cycle) % cycle; // 0-based
    const targetIdx = dia - 1; // 0-based
    const offset = (targetIdx - todayDiaIdx + cycle) % cycle;
    const nextDate = new Date(today);
    nextDate.setDate(nextDate.getDate() + offset);
    return getDayType(nextDate);
  }

  function previewHtml(d) {
    if (d.type === '公休') {
      return `<span class="pv-kyukyu">公休</span>`;
    }
    if (d.type === '予備') {
      return `<span class="pv-yobi">予備</span>`;
    }
    // 各ダイヤが次に回ってくる日の曜日でプレビュー表示
    const previewDayType = getDayTypeForDia(d.dia);
    const src = previewDayType === '土曜' ? d.doy : previewDayType === '日祝' ? d.nch : d.hei;
    if (!src || src.type === '公休') return '<span class="pv-kyukyu">公休</span>';

    // 中間ダイヤ：前半・後半両方表示
    if (d.type === '中間' && src.start2) {
      return `<span class="pv-time">${src.start||'—'}</span>〜<span class="pv-time">${src.taikin||'—'}</span> / <span class="pv-time">${src.start2}</span>〜<span class="pv-time">${src.taikin2||'—'}</span>`;
    }

    const t = src.start || src.start2 || '';
    return t ? `<span class="pv-time">${t}</span> 〜 <span class="pv-time">${src.taikin||src.taikin2||'—'}</span>` : '—';
  }

  function timeGridHtml(sd, isSecond) {
    if (!sd) return '<div class="ich-dow-kyukyu">公　休</div>';
    if (sd.type === '公休') return '<div class="ich-dow-kyukyu">公　休</div>';
    if (sd.yobi) return '<div class="ich-dow-yobi">予　備</div>';
    const st  = isSecond ? sd.start2   : sd.start;
    const tk  = isSecond ? sd.taikin2  : sd.taikin;
    const rs  = isSecond ? (sd.rosen2 || '') : (sd.rosen || '');

    const calcMode = SETTINGS.ichiranCalcMode;
    const s = SETTINGS;
    const wake   = s.wakeBeforeLeave   ?? 90;
    const leave  = s.leaveBeforeWork   ?? 60;
    const arrive = s.arriveBeforeStart ?? 30;
    const retMin = s.returnAfterEnd    ?? 10;

    let okVal, skVal, tcVal, ktVal;
    if (calcMode) {
      // 設定時間オフセットから計算
      const startMin = timeToMin(_convTime(st));
      const taikinMin = timeToMin(_convTime(tk));
      okVal = startMin !== null ? minToTime(startMin - wake)   : '—';
      skVal = startMin !== null ? minToTime(startMin - leave)  : '—';
      tcVal = startMin !== null ? minToTime(startMin - arrive) : '—';
      ktVal = taikinMin !== null ? minToTime(taikinMin + retMin) : '—';
    } else {
      // 従来：データそのまま
      const ok  = isSecond ? sd.okibo2   : sd.okibo;
      const sk  = isSecond ? sd.shukkin2 : sd.shukkin;
      const tc  = isSecond ? sd.tochaku2 : sd.tochaku;
      const kt  = isSecond ? sd.kitan2   : sd.kitan;
      okVal = ok || '—';
      skVal = sk || '—';
      tcVal = tc || '—';
      ktVal = kt || '—';
    }

    const row1 = [
      ['起床', okVal, ''],
      ['出社', skVal, ''],
      ['到着', tcVal, ''],
    ].filter(([lbl]) => {
      if (lbl==='起床') return SETTINGS.showOkibo;
      if (lbl==='出社') return SETTINGS.showShukkin;
      if (lbl==='到着') return SETTINGS.showTochaku;
      return true;
    });
    const row2 = [
      ['出勤', st||'—', 'start'],
      ['退勤', tk||'—', 'taikin'],
      ['帰宅', ktVal, ''],
    ].filter(([lbl]) => {
      if (lbl==='出勤') return SETTINGS.showShukkinTime;
      if (lbl==='退勤') return SETTINGS.showTaikinTime;
      if (lbl==='帰宅') return SETTINGS.showKikaku;
      return true;
    });
    const cell = ([lbl,val,cls]) =>
      `<div class="ich-time-cell"><div class="ich-time-cell-lbl">${lbl}</div><div class="ich-time-cell-val ${cls}">${val}</div></div>`;
    const row1Html = row1.length
      ? `<div class="ich-time-row" style="grid-template-columns:repeat(${row1.length},1fr)">${row1.map(cell).join('')}</div>` : '';
    const row2Html = row2.length
      ? `<div class="ich-time-row" style="grid-template-columns:repeat(${row2.length},1fr)">${row2.map(cell).join('')}</div>` : '';
    const row3Html = `<div class="ich-rosen-row3">🚌 ${rs||'—'}</div>`;
    return `<div class="ich-time-rows">${row1Html}${row2Html}${row3Html}</div>`;
  }

  function dowBlockHtml(label, cls, sd, isTodayDow, isMiddle, isNextDow) {
    const todayMark = isTodayDow ? '<span class="ich-dow-today-mark">TODAY</span>' : '';
    const nextCls = isNextDow ? (cls === 'doy' ? ' next-doy' : cls === 'nch' ? ' next-nch' : cls === 'hei' ? ' next-hei' : '') : '';
    if (isMiddle) {
      return `<div class="ich-dow-block ${cls}${nextCls}">
        <div class="ich-dow-header"><span class="ich-dow-header-label">${label}</span>${todayMark}</div>
        <div class="ich-middle-sep">▲ 前半</div>
        ${timeGridHtml(sd, false)}
        <div class="ich-middle-sep">▼ 後半</div>
        ${timeGridHtml(sd, true)}
      </div>`;
    }
    const inner = (!sd || sd.type === '公休')
      ? '<div class="ich-dow-kyukyu">公　休</div>'
      : timeGridHtml(sd, false);
    return `<div class="ich-dow-block ${cls}${nextCls}">
      <div class="ich-dow-header"><span class="ich-dow-header-label">${label}</span>${todayMark}</div>
      ${inner}
    </div>`;
  }

  let cards = '';
  for (const d of ICHIRAN) {
    const isToday = d.dia === todayDia;
    const isMiddle = d.type === '中間';
    const isKyukyu = d.type === '公休';
    const openDefault = isToday;

    const heiTodayDow = isToday && todayDayType === '平日';
    const doyTodayDow = isToday && todayDayType === '土曜';
    const nchTodayDow = isToday && todayDayType === '日祝';

    // 次回出番日の曜日でハイライトするブロックを決定
    const nextDayType = getDayTypeForDia(d.dia);
    const heiNextHighlight = nextDayType === '平日';
    const doyNextHighlight = nextDayType === '土曜';
    const nchNextHighlight = nextDayType === '日祝';

    const bodyHtml = isKyukyu
      ? `<div class="ich-card-body-inner"><div style="text-align:center;color:#e03a3a;font-weight:700;font-size:16px;padding:6px 0;letter-spacing:0.15em">公　　　休</div></div>`
      : (d.type === '予備')
      ? `<div class="ich-card-body-inner"><div style="text-align:center;color:#3a6e50;font-weight:700;font-size:16px;padding:6px 0">予　　　備</div></div>`
      : `<div class="ich-card-body-inner">
          ${dowBlockHtml('平日', 'hei', d.hei, heiTodayDow, isMiddle, heiNextHighlight)}
          ${dowBlockHtml('土曜', 'doy', d.doy, doyTodayDow, false, doyNextHighlight)}
          ${dowBlockHtml('日祝', 'nch', d.nch, nchTodayDow, false, nchNextHighlight)}
        </div>`;

    cards += `<div class="ich-card${isToday ? ' ich-card-today' : ''}${openDefault ? ' open' : ''}" id="ich-card-${d.dia}" onclick="toggleIchCard(${d.dia})">
      <div class="ich-card-header">
        <div class="ich-card-num">${d.dia}<div class="ich-card-num-sub">No.</div></div>
        <div class="ich-card-info">
          <div class="ich-card-badges">
            ${isToday ? '<span class="ich-card-today-badge">TODAY</span>' : ''}
            ${(isMiddle && nextDayType !== '平日') ? '' : typeBadgeHtml(d.type)}
          </div>
          <div class="ich-card-preview">${previewHtml(d)}</div>
        </div>
        <div class="ich-card-chevron">▼</div>
      </div>
      <div class="ich-card-body">${bodyHtml}</div>
    </div>`;
  }

  document.getElementById('view-ichiran').innerHTML = `
    <div class="section-label">📄 一覧表</div>
    <div class="ich-cards">${cards}</div>
  `;

}

function togglePreview() {

  SETTINGS.showShukkin     = document.getElementById('tog-shukkin').checked;

  SETTINGS.showShukkinTime = document.getElementById('tog-shukkinTime').checked;
  SETTINGS.showTaikinTime  = document.getElementById('tog-taikinTime').checked;
  SETTINGS.showKikaku      = document.getElementById('tog-kikaku').checked;

function applySettings() {
  const dateVal  = document.getElementById('set-date').value;
  const dia      = parseInt(document.getElementById('set-dia').textContent);
  const cycle    = parseInt(document.getElementById('set-cycle').textContent);
  const wake     = (parseInt(document.getElementById('set-wake-h').value)||0)*60   + (parseInt(document.getElementById('set-wake-m').value)||0);
  const leave    = (parseInt(document.getElementById('set-leave-h').value)||0)*60  + (parseInt(document.getElementById('set-leave-m').value)||0);
  const arrive   = (parseInt(document.getElementById('set-arrive-h').value)||0)*60 + (parseInt(document.getElementById('set-arrive-m').value)||0);
  const ret      = (parseInt(document.getElementById('set-return-h').value)||0)*60 + (parseInt(document.getElementById('set-return-m').value)||0);

  if (!dateVal || !dia || dia < 1 || dia > cycle || !cycle) {
    document.getElementById('save-msg').textContent = '⚠️ 入力値を確認してください';
    document.getElementById('save-msg').style.color = '#f87171';
    return;
  }

  // 時間オフセットの大小チェック: 0 < arrive < leave < wake
  if (!(arrive > 0 && leave > arrive && wake > leave)) {
    showTimeErrorModal();
    return;
  }

  SETTINGS = {
    baseDate: dateVal, baseDia: dia, cycle: cycle,
    wakeBeforeLeave:   wake,
    leaveBeforeWork:   leave,
    arriveBeforeStart: arrive,
    returnAfterEnd:    ret,
    showOkibo:       document.getElementById('tog-okibo').checked,
    showShukkin:     document.getElementById('tog-shukkin').checked,
    showTochaku:     document.getElementById('tog-tochaku').checked,
    showShukkinTime: document.getElementById('tog-shukkinTime').checked,
    showTaikinTime:  document.getElementById('tog-taikinTime').checked,
    showKikaku:      document.getElementById('tog-kikaku').checked,
    ichiranCalcMode: document.getElementById('tog-ichiranCalc').checked,
  };
  saveSettings(SETTINGS);
  // 設定変更済みフラグをクリア（警告を次回から出さないようにする）
  // ただしデフォルト値のままなら次回起動時にまた警告
  render();
  renderSettings();
  document.getElementById('save-msg').textContent = '✅ 保存しました！';
  document.getElementById('save-msg').style.color = '#34d399';
  setTimeout(() => { const el = document.getElementById('save-msg'); if(el) el.textContent=''; }, 2000);
}

// ========== ファイル保存・読込 ==========
async function doExport() {
  const now = new Date();
  const fname = `出勤管理_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.json`;
  const appData = {
    version: 1,
    savedAt: now.toISOString(),
    shiftSettings:     localStorage.getItem('shiftSettings')     || null,
    diaOverrides:      localStorage.getItem('diaOverrides')      || null,
    shukkinOverrides:  localStorage.getItem('shukkinOverrides')  || null,
    warningSuppressed: localStorage.getItem('warningSuppressed') || null,
  };
  const json = JSON.stringify(appData, null, 2);

  // showSaveFilePicker対応ブラウザ（Chrome等・HTTPS環境）→ 保存先を選べる
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: fname,
        types: [{ description: 'JSONファイル', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await fh.createWritable();
      await writable.write(json);
      await writable.close();
      return;
    } catch(e) {
      if (e.name === 'AbortError') return; // キャンセルは何もしない
      // SecurityError等はフォールバックへ
    }
  }

  // フォールバック（Safari・ローカルファイル等）→ ダウンロードフォルダ
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadAppFromFile() {
  // showOpenFilePicker対応ブラウザ（Chrome等・HTTPS環境）→ 保存先を選べる
  if (window.showOpenFilePicker) {
    try {
      const [fh] = await window.showOpenFilePicker({
        types: [{ description: 'JSONファイル', accept: { 'application/json': ['.json'] } }],
        multiple: false
      });
      const file = await fh.getFile();
      const text = await file.text();
      _applyImport(text, file.name);
      return;
    } catch(err) {
      if (err.name === 'AbortError') return; // キャンセルは何もしない
      // フォールバックへ
    }
  }

  // フォールバック（input[type=file]経由）
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      _applyImport(ev.target.result, file.name);
    };
    reader.readAsText(file);
  };
  input.click();
}

function _applyImport(text, fname) {
  try {
    const data = JSON.parse(text);
    if (data.shiftSettings)     localStorage.setItem('shiftSettings',     data.shiftSettings);
    if (data.diaOverrides)      localStorage.setItem('diaOverrides',      data.diaOverrides);
    if (data.shukkinOverrides)  localStorage.setItem('shukkinOverrides',  data.shukkinOverrides);
    if (data.warningSuppressed) localStorage.setItem('warningSuppressed', data.warningSuppressed);

    // データ再読み込み
    SETTINGS = loadSettings();
    try { DIA_OVERRIDES     = JSON.parse(localStorage.getItem('diaOverrides') || '{}'); } catch(e) { DIA_OVERRIDES = {}; }
    try { SHUKKIN_OVERRIDES = JSON.parse(localStorage.getItem('shukkinOverrides') || '{}'); } catch(e) { SHUKKIN_OVERRIDES = {}; }
    render();
    if (currentView === 'settings') renderSettings();
    alert('📂 読込完了しました！\nファイル: ' + (fname || ''));
  } catch(err) {
    alert('⚠️ 読込エラー: ファイル形式が正しくありません');
  }
}

// テンキーダイアログ制御
let numpadTargetH = null;  // 時間inputEl
let numpadTargetM = null;  // 分inputEl
let numpadSeg = 'h';       // 現在編集中: 'h' or 'm'
let numpadValH = '0';
let numpadValM = '00';

function openNumpad(hInput, mInput, title) {
  numpadTargetH = hInput;
  numpadTargetM = mInput;
  numpadValH = hInput.value || '0';
  numpadValM = String(parseInt(mInput.value) || 0).padStart(2, '0');
  numpadSeg = 'h';
  document.getElementById('numpad-title').textContent = title || '時間を設定';
  updateNumpadDisplay();
  selectSeg('h');
  document.getElementById('numpad-overlay').classList.remove('hidden');
  // スマホキーボードを抑止
  hInput.blur(); mInput.blur();
}

function selectSeg(seg) {
  if (numpadSeg === 'h' && (numpadValH === '' || numpadValH === undefined)) numpadValH = '0';
  if (numpadSeg === 'm' && (numpadValM === '' || numpadValM === undefined)) numpadValM = '0';
  numpadSeg = seg;
  updateNumpadDisplay();
  document.getElementById('seg-h').classList.toggle('active', seg === 'h');
  document.getElementById('seg-m').classList.toggle('active', seg === 'm');
}

function updateNumpadDisplay() {
  document.getElementById('seg-h-val').textContent = numpadValH;
  document.getElementById('seg-m-val').textContent = numpadValM.padStart(2,'0');
}

function numpadKey(k) {
  if (numpadSeg === 'h') {
    if (k === 'C') { numpadValH = ''; }
    else if (k === 'del') { numpadValH = numpadValH.length > 1 ? numpadValH.slice(0,-1) : ''; }
    else {
      const next = numpadValH === '' ? k : numpadValH + k;
      numpadValH = next.length > 2 ? next.slice(-2) : next;
    }
  } else {
    if (k === 'C') { numpadValM = ''; }
    else if (k === 'del') { numpadValM = numpadValM.length > 1 ? numpadValM.slice(0,-1) : ''; }
    else {
      const next = (numpadValM === '' || numpadValM === '0') ? k : numpadValM + k;
      let val = parseInt(next);
      if (val > 59) val = 59;
      numpadValM = String(val);
    }
  }
  updateNumpadDisplay();
}

function closeNumpad() {
  document.getElementById('numpad-overlay').classList.add('hidden');
}

function numpadOk() {
  if (numpadValH === '' || numpadValH === undefined) numpadValH = '0';
  if (numpadValM === '' || numpadValM === undefined) numpadValM = '0';
  if (numpadTargetH) numpadTargetH.value = parseInt(numpadValH) || 0;
  if (numpadTargetM) numpadTargetM.value = parseInt(numpadValM) || 0;
  closeNumpad();
  updateTimeDiffLabels();
}

function updateTimeDiffLabels() {
  const wakeMin   = (parseInt(document.getElementById('set-wake-h')?.value)||0)*60  + (parseInt(document.getElementById('set-wake-m')?.value)||0);
  const leaveMin  = (parseInt(document.getElementById('set-leave-h')?.value)||0)*60 + (parseInt(document.getElementById('set-leave-m')?.value)||0);
  const arriveMin = (parseInt(document.getElementById('set-arrive-h')?.value)||0)*60+ (parseInt(document.getElementById('set-arrive-m')?.value)||0);

  // 起床→出社の差（wake - leave）
  const wakeToLeave = wakeMin - leaveMin;
  const subWake = document.getElementById('sub-wake');
  if (subWake) {
    if (wakeToLeave > 0) {
      const h = Math.floor(wakeToLeave / 60), m = wakeToLeave % 60;
      subWake.textContent = h > 0
        ? `出社まで ${h}時間${m > 0 ? m + '分' : ''}`
        : `出社まで ${m}分`;
    } else {
      subWake.textContent = '出社まで（要確認）';
    }
  }

  // 出社→到着の差（leave - arrive）
  const leaveToArrive = leaveMin - arriveMin;
  const subLeave = document.getElementById('sub-leave');
  if (subLeave) {
    if (leaveToArrive > 0) {
      const h = Math.floor(leaveToArrive / 60), m = leaveToArrive % 60;
      subLeave.textContent = h > 0
        ? `到着まで ${h}時間${m > 0 ? m + '分' : ''}`
        : `到着まで ${m}分`;
    } else {
      subLeave.textContent = '到着まで（要確認）';
    }
  }
}

function diaNumpadKey(k) {
  const currentCycle = parseInt(document.getElementById('set-cycle')?.textContent) || getCycle();
  const maxVal = diaNumpadMode === 'cycle' ? 999 : currentCycle;
  if (k === 'C') { diaNumpadVal = ''; }
  else if (k === 'del') { diaNumpadVal = diaNumpadVal.length > 1 ? diaNumpadVal.slice(0,-1) : ''; }
  else {
    const next = diaNumpadVal === '' ? k : diaNumpadVal + k;
    let val = parseInt(next);
    if (val > maxVal) val = maxVal;
    if (val < 1) val = 1;
    diaNumpadVal = String(val);
  }
  document.getElementById('dia-numpad-display').textContent = diaNumpadVal || '';
}

function diaNumpadReset() {
  delete DIA_OVERRIDES[diaNumpadDateKey];
  saveDiaOverrides();
  closeDiaNumpad();
  render();
}

function diaNumpadOk() {
  const val = parseInt(diaNumpadVal);
  const maxVal = diaNumpadMode === 'cycle' ? 999 : getCycle();
  if (isNaN(val) || val < 1 || val > maxVal) {
    document.getElementById('dia-numpad-display').textContent = '!';
    setTimeout(() => { document.getElementById('dia-numpad-display').textContent = diaNumpadVal || ''; }, 600);
    return;
  }
  if (diaNumpadMode === 'spot') {
    if (val === diaNumpadOriginal) {
      delete DIA_OVERRIDES[diaNumpadDateKey];
    } else {
      DIA_OVERRIDES[diaNumpadDateKey] = val;
    }
    saveDiaOverrides();
    closeDiaNumpad();
    render();
  } else {
    document.getElementById(diaNumpadMode === 'dia' ? 'set-dia' : 'set-cycle').textContent = val;
    closeDiaNumpad();
  }
}

// ── スワイプで予定⇔設定を切り替え ──
(function() {
  const el = document.querySelector('.content');
  if (!el) return;

  const TABS = ['week', 'ichiran', 'settings'];
  let startX = 0, startY = 0, startTime = 0, startScrollLeft = 0;

  el.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    startTime = Date.now();
    // ich-wrap のスクロール位置を記録
    const wrap = e.target.closest('.ich-wrap');
    startScrollLeft = wrap ? wrap.scrollLeft : 0;
  }, { passive: true });

  el.addEventListener('touchend', function(e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startTime;

    // 水平方向が主体 / 50px以上 / 400ms以内
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.8 || dt > 400) return;

    // ich-wrap内で実際に横スクロールが起きていたらタブ切り替えしない
    const wrap = e.target.closest('.ich-wrap');
    if (wrap && Math.abs(wrap.scrollLeft - startScrollLeft) > 5) return;

    const cur = TABS.indexOf(currentView);
    if (dx < 0 && cur < TABS.length - 1) switchTab(TABS[cur + 1], -1);
    if (dx > 0 && cur > 0)              switchTab(TABS[cur - 1],  1);
  }, { passive: true });
})();

    let touched = false;
    el.addEventListener('touchend', function(e) {
      e.preventDefault();
      touched = true;
      fn();
      setTimeout(() => { touched = false; }, 500);
    }, { passive: false });
    el.addEventListener('click', function(e) {
      if (touched) { touched = false; return; }
      fn();
    });
  }
  addTapOnly('btn-save', doExport);
  addTapOnly('btn-load', loadAppFromFile);
})();


// ===== 出勤時間（勤務開始）臨時変更テンキー =====
let _skDateKey = null, _skIdx = 0, _skOrigTime = '', _skSeg = 'h';
let _skH = '0', _skM = '00';

function openShukkinNumpad(dateKey, idx, origTime) {
  _skDateKey = dateKey;
  _skIdx = idx;
  _skOrigTime = origTime;
  var okey = dateKey + '_' + idx;
  var existing = SHUKKIN_OVERRIDES[okey];
  var initMin = (existing !== undefined) ? existing : (timeToMin(origTime) || 0);
  var baseMin = ((initMin % 1440) + 1440) % 1440;
  _skH = String(Math.floor(baseMin / 60));
  _skM = String(baseMin % 60).padStart(2, '0');
  _skSeg = 'h';
  var d = new Date(dateKey.replace(/-/g, '/'));
  document.getElementById('sk-np-date').textContent =
    d.toLocaleDateString('ja-JP', {month:'long', day:'numeric', weekday:'short'});
  _skUpdateDisplay();
  _skSelectSeg('h');
  document.getElementById('sk-np-overlay').classList.remove('hidden');
}
function _skSelectSeg(seg) {
  _skSeg = seg;
  document.getElementById('sk-np-seg-h').classList.toggle('active', seg === 'h');
  document.getElementById('sk-np-seg-m').classList.toggle('active', seg === 'm');
}
function _skUpdateDisplay() {
  document.getElementById('sk-np-h-val').textContent = _skH || '0';
  document.getElementById('sk-np-m-val').textContent = (_skM || '0').padStart(2, '0');
}
function skKey(k) {
  if (_skSeg === 'h') {
    if (k === 'C') { _skH = ''; }
    else if (k === 'del') { _skH = _skH.length > 1 ? _skH.slice(0,-1) : ''; }
    else { var n = (_skH === '' ? k : _skH + k); _skH = n.length > 2 ? n.slice(-2) : n; }
  } else {
    if (k === 'C') { _skM = ''; }
    else if (k === 'del') { _skM = _skM.length > 1 ? _skM.slice(0,-1) : ''; }
    else {
      var n2 = (_skM === '' || _skM === '0') ? k : _skM + k;
      var v = parseInt(n2); if (v > 59) v = 59;
      _skM = String(v);
    }
  }
  _skUpdateDisplay();
}
function skReset() {
  delete SHUKKIN_OVERRIDES[_skDateKey + '_' + _skIdx];
  saveShukkinOverrides();
  document.getElementById('sk-np-overlay').classList.add('hidden');
  render();
}
function skCancel() {
  document.getElementById('sk-np-overlay').classList.add('hidden');
}
function skOk() {
  var h = parseInt(_skH) || 0;
  var m = parseInt(_skM) || 0;
  if (h > 23 || m > 59) {
    var disp = document.getElementById('sk-np-h-val');
    if (disp) { var orig = disp.textContent; disp.textContent = '!'; setTimeout(function(){ disp.textContent = orig; }, 600); }
    return;
  }
  var newMin = h * 60 + m;
  var origMin = timeToMin(_skOrigTime);
  var okey = _skDateKey + '_' + _skIdx;
  if (newMin === origMin) { delete SHUKKIN_OVERRIDES[okey]; }
  else { SHUKKIN_OVERRIDES[okey] = newMin; }
  saveShukkinOverrides();
  document.getElementById('sk-np-overlay').classList.add('hidden');
  render();
}
setInterval(updateClock, 30000);

// ⑤ 日付変わり目（深夜0時）に再描画
(function scheduleMidnightRender() {
  var now = new Date();
  var msToMidnight = (new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1)) - now + 500;
  setTimeout(function() {
    render();
    scheduleMidnightRender();
  }, msToMidnight);
})();
</script>
